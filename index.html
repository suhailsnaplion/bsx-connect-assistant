<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Connect</title>
<style>
  :root {
    --navy: #003C71;
    --navy-deep: #00294D;
    --tint: #E8EEF4;
    --tint-mid: #C9D9E8;
    --gray: #4A4A4A;
    --gray-light: #8A94A0;
    --border: #DCE4EC;
    --bg: #F7F9FB;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    background: transparent;
    color: var(--gray);
  }

  /* ---------- Floating launcher ---------- */
  .launcher {
    position: fixed;
    bottom: 26px; right: 26px;
    width: 58px; height: 58px;
    border-radius: 50%;
    background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,60,113,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    z-index: 999;
  }
  .launcher:hover { transform: scale(1.06); box-shadow: 0 8px 24px rgba(0,60,113,0.42); }
  .launcher svg { width: 26px; height: 26px; }
  .launcher.hidden { display: none; }

  /* ---------- Chat panel ---------- */
  .widget {
    position: fixed;
    bottom: 26px; right: 26px;
    width: 400px;
    height: 620px;
    max-height: calc(100vh - 52px);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,40,80,0.22);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
  }
  .widget.open { display: flex; }

  .header {
    background: var(--navy);
    color: #fff;
    padding: 16px 16px 14px 18px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 7px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-text h1 {
    margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.2;
  }
  .brand-text span {
    font-size: 11px; color: var(--tint-mid);
  }
  .header-actions { display: flex; align-items: center; gap: 4px; }
  .icon-btn {
    background: none; border: none; cursor: pointer;
    width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; opacity: 0.85;
    transition: background 0.12s ease, opacity 0.12s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.14); opacity: 1; }
  .icon-btn svg { width: 16px; height: 16px; }

  .settings-panel {
    display: none;
    padding: 12px 18px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
    font-size: 12px;
  }
  .settings-panel.open { display: block; }
  .settings-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .settings-row label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--gray); }
  .settings-panel input[type="password"] {
    flex: 1; min-width: 180px;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 9px; font-size: 12px; font-family: inherit;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .chip {
    font-size: 12px;
    color: var(--navy);
    background: var(--tint);
    border: 1px solid var(--tint-mid);
    padding: 5px 11px;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .chip:hover { background: var(--tint-mid); }

  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { display: flex; flex-direction: column; max-width: 86%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 13.8px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: var(--navy);
    color: #fff;
    border-bottom-right-radius: 3px;
  }
  .msg.bot .bubble {
    background: var(--tint);
    color: #1a2733;
    border-bottom-left-radius: 3px;
  }
  .msg.bot.fallback .bubble {
    background: #FBF3E7;
    border: 1px solid #E8D3A8;
    color: #6B4F1D;
  }

  .composer {
    border-top: 1px solid var(--border);
    padding: 12px 14px 14px;
    flex-shrink: 0;
    background: #fff;
  }
  .composer form {
    display: flex;
    gap: 8px;
  }
  .composer input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13.8px;
    font-family: inherit;
    color: var(--gray);
    outline: none;
  }
  .composer input:focus { border-color: var(--navy); }
  .composer button {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .composer button:disabled {
    background: var(--gray-light);
    cursor: default;
  }
  .typing {
    display: flex; gap: 4px; padding: 6px 0;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gray-light);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  @media (max-width: 460px) {
    .widget { width: calc(100vw - 24px); right: 12px; bottom: 12px; height: calc(100vh - 24px); }
    .launcher { bottom: 16px; right: 16px; }
  }
</style>
</head>
<body>

<div class="launcher" id="launcher" title="Chat with BS Connect">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 4H20C21.1 4 22 4.9 22 6V16C22 17.1 21.1 18 20 18H8L4 22V18H4C2.9 18 2 17.1 2 16V6C2 4.9 2.9 4 4 4Z" fill="white"/>
    <circle cx="8" cy="11" r="1.3" fill="#003C71"/>
    <circle cx="12" cy="11" r="1.3" fill="#003C71"/>
    <circle cx="16" cy="11" r="1.3" fill="#003C71"/>
  </svg>
</div>

<div class="widget" id="widget">
  <div class="header">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="11" fill="#003C71"/>
          <path d="M12 5 L12 19 M5 12 L19 12" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>BS Connect</h1>
        <span>Boston Scientific</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="closeWidget" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="thread" id="thread"></div>

  <div class="composer">
    <form id="composerForm">
      <input id="input" type="text" placeholder="Ask a question…" autocomplete="off" />
      <button id="sendBtn" type="submit">Ask</button>
    </form>
  </div>
</div>

<script>
// ---------------------------------------------------------------
// Retrieval, the knowledge base, and the model call all now live server-side
// in /api/chat — this file only sends the raw question and renders the answer.
// ---------------------------------------------------------------

// ---------------------------------------------------------------
// UI wiring — launcher + widget open/close
// ---------------------------------------------------------------
const launcher = document.getElementById("launcher");
const widget = document.getElementById("widget");
const closeWidget = document.getElementById("closeWidget");

launcher.addEventListener("click", () => {
  widget.classList.add("open");
  launcher.classList.add("hidden");
  document.getElementById("input").focus();
});
closeWidget.addEventListener("click", () => {
  widget.classList.remove("open");
  launcher.classList.remove("hidden");
});

const thread = document.getElementById("thread");
const form = document.getElementById("composerForm");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const chipsEl = document.getElementById("chips");

const SAMPLE_QUESTIONS = [
  "How do I log in?",
  "Can I still use spreadsheets?",
  "When does my market launch?",
  "What's my refund policy?"
];

SAMPLE_QUESTIONS.forEach(q => {
  const chip = document.createElement("div");
  chip.className = "chip";
  chip.textContent = q;
  chip.onclick = () => { input.value = q; form.dispatchEvent(new Event("submit")); };
  chipsEl.appendChild(chip);
});

function addMessage(role, opts) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role + (opts.fallback ? " fallback" : "");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = opts.text;
  wrap.appendChild(bubble);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
  return wrap;
}

function addTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg bot";
  wrap.id = "typingIndicator";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  wrap.appendChild(bubble);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
}
function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

// In-memory conversation history for this session only — never persisted to
// any storage. Lets the assistant respond naturally to context ("okay",
// "and what about mobile?") instead of treating every message in isolation.
const conversationHistory = [];
const MAX_HISTORY_MESSAGES = 12; // ~6 exchanges of context

async function handleQuery(query) {
  addTyping();

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, history: conversationHistory.slice(-MAX_HISTORY_MESSAGES) })
    });
    const data = await response.json();
    removeTyping();

    if (data.error) {
      addMessage("bot", {
        text: "Something went wrong reaching the assistant service. Please try again in a moment.",
        fallback: true
      });
      return;
    }

    addMessage("bot", { text: data.answer, fallback: !data.grounded });

    // Record this exchange for future context
    conversationHistory.push({ role: "user", content: query });
    conversationHistory.push({ role: "assistant", content: data.answer });
  } catch (err) {
    removeTyping();
    addMessage("bot", {
      text: "Something went wrong reaching the assistant service. Please try again in a moment.",
      fallback: true
    });
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const query = input.value.trim();
  if (!query) return;
  addMessage("user", { text: query });
  input.value = "";
  sendBtn.disabled = true;
  handleQuery(query).finally(() => { sendBtn.disabled = false; input.focus(); });
});

// Opening message
addMessage("bot", {
  text: "Hi — I'm the BS Connect Assistant. Ask me how to log in, sync your account data, submit a quote, or find the right person for help.",
  fallback: false
});
</script>

</body>
</html>
